<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You for Contacting Us | GraNet IT Solutions</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="../assets/css/styles.css" />

  <style>
    .thank-you-main {
      min-height: calc(100dvh - 88px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
    }

    .thank-you-card {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: clamp(32px, 6vw, 58px);
      border: 1px solid var(--border, #d9e2ee);
      border-radius: 24px;
      background: linear-gradient(135deg, #ffffff 0%, #fef7f8 100%);
      box-shadow: var(--shadow, 0 18px 40px rgba(15, 23, 42, 0.08));
      text-align: center;
    }

    .thank-you-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--red, #d21f3c);
      color: #ffffff;
      font-size: 2.1rem;
      font-weight: 1000;
      line-height: 1;
      box-shadow: 0 18px 34px rgba(210, 31, 60, 0.2);
    }

    .thank-you-card .card-eyebrow {
      margin-inline: auto;
    }

    .thank-you-card h1 {
      margin: 0 0 14px;
      color: var(--navy, #061d37);
      font-size: clamp(2.1rem, 5vw, 3.55rem);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    .thank-you-card p {
      max-width: 590px;
      margin: 0 auto 16px;
      color: var(--muted, #5d6b7c);
      font-size: 1.05rem;
    }

    .redirect-note {
      max-width: 560px;
      margin: 22px auto 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(6, 29, 55, 0.07);
      color: #334155;
      font-weight: 800;
    }

    .redirect-note strong {
      color: var(--red, #d21f3c);
    }

    .thank-you-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    @media (max-width: 640px) {
      .thank-you-main {
        min-height: calc(100dvh - 70px);
        padding: 34px 18px;
      }

      .thank-you-actions {
        display: grid;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body id="top">
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="../" aria-label="GraNet IT Solutions home">
        <span>GraNet IT Solutions</span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="../">Home</a>
        <a href="../services">Services</a>
        <a href="../#about">About Us</a>
        <a href="../#contact">Contact</a>
      </nav>

      <a class="btn dark header-cta" href="../services">Our Services</a>
    </div>
  </header>

  <main class="thank-you-main">
    <section class="thank-you-card" aria-labelledby="thank-you-title">
      <div class="thank-you-icon" aria-hidden="true">✓</div>

      <div id="thank-you-status" class="card-eyebrow">Message Received</div>

      <h1 id="thank-you-title">Thank you for contacting us!</h1>

      <p id="thank-you-message">
        Your message has been received. We'll review it and get back to you as soon as possible.
      </p>

      <div class="redirect-note">
        Returning you to the home page in <strong id="redirect-count">10</strong> <span id="seconds_field">seconds</span>.
      </div>

      <div class="thank-you-actions">
        <a class="btn primary" href="../">Go Home Now</a>
        <a class="btn" href="../services">View Services</a>
      </div>
    </section>
  </main>

  <script>
    (() => {
      if (new URLSearchParams(window.location.search).get('method') === 'schedule') {
        document.title = 'Thank You for Scheduling | GraNet IT Solutions';
        document.getElementById('thank-you-status').textContent = 'Appointment Scheduled';
        document.getElementById('thank-you-title').textContent = 'Thank you for scheduling with us!';
        document.getElementById('thank-you-message').textContent = 'Your consultation request has been received. We\'ll see you at the scheduled time and help sort out the next best step.';
      }

      const count = document.getElementById("redirect-count");
      const seconds_field = document.getElementById('seconds_field');
      let seconds = 10;

      const countDownInterval = window.setInterval(() => {
        --seconds;
        if (seconds > 0) {
          count.textContent = seconds;
          seconds_field.textContent = seconds === 1 ? 'second' : 'seconds';
        } else {
          clearInterval(countDownInterval);
          window.location.href = '../';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
