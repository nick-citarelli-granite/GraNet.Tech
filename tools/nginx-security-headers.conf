add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://internal.granet.tech; connect-src 'self' https://internal.granet.tech; img-src 'self' data:; font-src 'self'; style-src 'self'; style-src-attr 'none'; script-src 'self' 'sha256-GPXM37tI65QLC5fR74uALy7D93IeOriEBkm+Sq95Y/4=' 'sha256-zMZADW8EfnsuIMKEysXPRtbAqw9/K5r9UTBNYtvx75M=' 'sha256-xj2LWCnNP/RBzGmX42BEviJzpwLATx1btMq5STx5Ybc=' 'sha256-4olqHQEIQAmNUVPcSgktRXN3mtK4JPP2A/n9zaElCwc=' 'sha256-rFObatOrElZoUnAzJ7tOYluVw+GGHFxPllrIhwBKDcs=' 'sha256-w26qH/MXsAkA5JwruuBOLrH4h2h5uHnwIDLplhtylUg='; script-src-attr 'none'; upgrade-insecure-requests" always;
