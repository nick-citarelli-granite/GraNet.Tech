<html>
<head>
  <style>
    body {
      background-color: black;
    }

    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url("../fonts/space-grotesk-latin.woff2") format("woff2");
    }

    .signal-band {
      position: relative;
      overflow: hidden;
      border-block: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(
        90deg,
        rgba(239, 41, 71, 0.08),
        rgba(86, 216, 255, 0.07)
      );
    }

    .signal-track {
      display: flex;
      width: max-content;
      gap: 42px;
      padding: 17px 0;
      animation: marquee 30s linear infinite;
      color: #bfc9d6;
      font:
        700 0.75rem/1 "Space Grotesk",
        "Aptos Display",
        "Segoe UI",
        sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .signal-track span:first-child {
      margin-left: 42px;
    }

    .signal-track span::after {
      margin-left: 42px;
      color: #ef2947;
      content: "✦";
    }
  </style>
</head>
<body>
  <!-- <div class="signal-band" aria-hidden="true"> -->
    <div class="signal-track">
      <span>Software development</span>
      <span>AI automation</span>
      <span>Managed IT</span>
      <span>Cybersecurity</span>
      <span>Microsoft 365</span>
      <span>Web development</span>
      <span>Computer support</span>
    </div>
  <!-- </div> -->
</body>
</html>
